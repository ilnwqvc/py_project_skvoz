variant_id: "06"
theme: "Погода (архив) - Токио"
source_type: "open_meteo"

entity:
  city_id: "JP_TYO"
  city_name: "Токио"
  country_code: "JP"
  latitude: 35.6762
  longitude: 139.6503
  timezone: "Asia/Tokyo"

api:
  base_url: "https://archive-api.open-meteo.com/v1/archive"
  method: "GET"
  timeout_sec: 30
  params:
    latitude: 35.6762
    longitude: 139.6503
    timezone: "Asia/Tokyo"
    hourly:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - wind_speed_10m
  date_params:
    start_date: "2026-02-01"   
    end_date: "2026-03-01"

normalized_schema:
  - name: ts
    type: timestamp
    desc: "Дата-время измерения (локальная TZ)."
  - name: temperature_2m
    type: float
  - name: relative_humidity_2m
    type: float
  - name: precipitation
    type: float
  - name: wind_speed_10m
    type: float
  - name: city_id
    type: string

kpis_draft:
  - name: T_mean
    desc: "Средняя температура по дням"
  - name: P_sum
    desc: "Суммарные осадки по дням"
  - name: max_wind_top5
    desc: "Топ-5 дней по максимальной скорости ветра"
  - name: rainy_hours
    desc: "Количество часов с precipitation > 0 по дням"

dq_rules:
  normalized:
    - name: normalized_not_empty
      type: non_empty
      severity: FAIL
    - name: normalized_not_null_keys
      type: not_null
      severity: FAIL
      columns: [ts, city_id]
    - name: normalized_unique_business_key
      type: unique_key
      severity: FAIL
      columns: [city_id, ts]
    - name: normalized_ts_is_datetime
      type: convertible_datetime
      severity: FAIL
      column: ts
    - name: normalized_ts_monotonic
      type: monotonic_increasing
      severity: WARNING
      column: ts
      group_by: [city_id]
    - name: normalized_temperature_range
      type: numeric_range
      severity: FAIL
      column: temperature_2m
      min: -80
      max: 60
    - name: normalized_humidity_range
      type: numeric_range
      severity: FAIL
      column: relative_humidity_2m
      min: 0
      max: 100
    - name: normalized_precipitation_non_negative
      type: numeric_range
      severity: FAIL
      column: precipitation
      min: 0
    - name: normalized_city_allowed
      type: allowed_values
      severity: WARNING
      column: city_id
      values: [JP_TYO]
  mart:
    - name: mart_not_empty
      type: non_empty
      severity: FAIL
    - name: mart_not_null_keys
      type: not_null
      severity: FAIL
      columns: [date, city_id]
    - name: mart_unique_business_key
      type: unique_key
      severity: FAIL
      columns: [date, city_id]
    - name: mart_date_is_datetime
      type: convertible_datetime
      severity: FAIL
      column: date
    - name: mart_precipitation_non_negative
      type: numeric_range
      severity: FAIL
      column: P_sum
      min: 0
    - name: mart_rainy_hours_range
      type: numeric_range
      severity: WARNING
      column: rainy_hours
      min: 0
      max: 24
    - name: mart_wind_non_negative
      type: numeric_range
      severity: WARNING
      column: wind_max
      min: 0
    - name: mart_city_allowed
      type: allowed_values
      severity: WARNING
      column: city_id
      values: [JP_TYO]

storage:
  raw_path: data/raw
  state_path: data/state.json
